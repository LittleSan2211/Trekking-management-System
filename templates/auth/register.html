{% extends 'base.html' %}
{% block title %}Register - TrekPlan{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card" style="max-width: 520px;">
        <div class="auth-brand">
            <span class="auth-brand-icon">⛰️</span>
            <h2>Join the Tribe</h2>
            <p>Create your account to start managing or exploring treks</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <!-- Role Selection -->
            <div class="mb-3">
                <label for="role" class="form-label">Register As</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="" selected disabled>Choose application role...</option>
                    <option value="trekker">User (Trekker)</option>
                    <option value="staff">Trek Staff</option>
                </select>
            </div>

            <!-- Full Name -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Email Address -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <!-- Contact Number -->
            <div class="mb-3">
                <label for="contact" class="form-label">Contact Number</label>
                <input type="tel" class="form-control" id="contact" name="contact" placeholder="9876543210" required>
            </div>

            <!-- Extra Fields for Trekker (Age & Gender) -->
            <div class="row mb-3">
                <div class="col-6">
                    <label for="age" class="form-label">Age (For Trekkers)</label>
                    <input type="number" class="form-control" id="age" name="age" min="10" max="100" placeholder="e.g. 25">
                </div>
                <div class="col-6">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender">
                        <option value="" selected disabled>Select...</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Create Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-adventure py-2 fw-bold">
                    <i class="bi bi-person-plus-fill me-1"></i> Register Account
                </button>
            </div>
        </form>

        <hr class="auth-divider">

        <div class="auth-footer">
            <p>Already have an account? 
                <a href="{{ url_for('auth.login') }}">Login Here</a>
            </p>
            <p>
                <a href="{{ url_for('home') }}"><i class="bi bi-house-door-fill"></i> Back to Home</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
